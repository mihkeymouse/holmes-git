
name: Deduction Engine

on:
  push:
    branches: [main]
    paths: [deduction.txt]

permissions:
  contents: write

concurrency:
  group: deduction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout case
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Advance deduction
        env:
          CASE_STAGE_URL: https://raw.githubusercontent.com/mihkeymouse/holmes-git/main/stages
        run: python -m scripts.advance

      
      - name: Push Watson's record
        run: |
          git push origin HEAD:main
          if git show-ref --verify --quiet refs/heads/testimony; then
            git push origin testimony evidence
          fi

               
